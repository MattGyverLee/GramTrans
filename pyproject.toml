[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gramtrans"
version = "0.1.0.dev0"
description = "Additive grammar-piece transfer between FieldWorks Language Explorer (FLEx) projects. Phase 0 module."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "GramTrans contributors" }]
license = { text = "MIT" }
dependencies = [
    # flexicon (direct runtime dep per constitution v5.1.0 Principle II).
    # CLAUDE.md documents the install path; pip install -e D:/Github/_Projects/_LEX/flexicon
    # before installing this package. The LibLCM-direct implementation lives in a
    # separate post-Phase-2 sibling repository (constitution Principle IV) — not here.
    # >=4.4.1: current supported version carrying the GUID-preserving create surface that
    # feature 033 depends on — BaseOperations._CreateWithGuid plus the optional
    # guid= kwarg on Texts.Create (+contents_guid=), Paragraphs.Create,
    # Segments.AppendSentence, Wordforms.Create, WfiAnalyses.Create,
    # WfiGlosses.Create and WfiMorphBundles.Create (flexicon PR #239).
    # This floor is load-bearing, not cosmetic: on an older flexicon every
    # guid= kwarg raises TypeError, which the engine's `_safe`/except-Exception
    # wrappers swallow into a generic "create failed" drop — so the transfer
    # SILENTLY regenerates identities instead of failing loudly.
    # (Superseded floor >=4.1.1: earliest with PhonFeatureOperations
    # GetSyncableProperties/ApplySyncableProperties; below it phonological-
    # feature transfer raised NotImplementedError, mbugwe Bug 3.)
    # >=4.5.0 (current floor, feature 037): earliest with
    # NaturalClassOperations.GetSyncableProperties/ApplySyncableProperties
    # FeaturesOA wiring (FeaturesGuid + Features specs, rewired against the
    # target's PhFeatureSystemOA by GUID -- flexicon issue #222). Below this
    # floor, GetSyncableProperties for a natural class returns only
    # Name/Abbreviation/Description/PhonemeGuids -- it never touches
    # FeaturesOA -- so every feature-based natural class (IPhNCFeatures)
    # transfers as an empty shell: correct Name/GUID, FeaturesOA silently
    # null. Measured against two live projects: 0 of 34 PhNCFeatures
    # transferred with a feature structure in one (source: 41 of 41), 0 of
    # 11 in the other (source: 15 of 15) -- silently breaking 14 of 21 and
    # 1 of 6 phonological rules respectively, since a rule referencing a
    # feature-based natural class with no features can no longer match
    # anything. This is precisely the failure mode
    # Lib/categories.py's natural_classes_execute_action now fails loudly on
    # (RuntimeError, not a silent drop) rather than the previous behaviour
    # of reporting the transfer as fully successful.
    "pyflexicon>=4.5.2",
    "PyQt6>=6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "black>=24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gramtrans"]

[tool.hatch.build.targets.sdist]
include = ["src/gramtrans", "README.md", "pyproject.toml"]

# ---------------------------------------------------------------------------
# T003: lint/format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py38"]
extend-exclude = "tests/fixtures"

# ---------------------------------------------------------------------------
# T004: pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# Collect the standard `test_*.py` modules PLUS the model-driven fidelity
# census (`tests/verification/fidelity_census.py`), whose filename does not
# match the default pattern. Without this, `pytest tests/verification/ -q`
# collects nothing (exit 5) even though the module holds real `test_*`
# functions (028 T015 / FR-009). The exact filename keeps collection scoped
# to that one non-`test_*` harness.
python_files = [
    "test_*.py",
    "fidelity_census.py",
]
markers = [
    "integration: requires the FlexTools host + a live LCM project pair (use `-m 'not integration'` to skip)",
]
